# dsh-plugin-dude bundle layer.
# `dsh plugin add` activates this patch automatically because package.json
# declares dsh.bundle.patch. The row loads the (empty) host half; the browser
# half — the stylesheet — rides the same row through dsh.client.
#
# This layer applies after @deepseek-ai/dsh-web-app's. Official ui-layout
# owns the frame and ctx.layout. Official ui-sidebar owns the left column.
# Dude does not disable either row: a second declarer of `root` is
# rejected by ui-slots, and a second `layout` provider deadlocks boot.
# Removing this plugin from the profile removes only the window drag surfaces
# and the hero mark.

- insert:
    - id: dude
      name: dsh-plugin-dude
